{% extends "base.html" %}
{% block content %}

<div class="container mt-5">
    <h2>Your Cart</h2>

    {% if cart_items %}
        {% for item in cart_items %}
        <div class="card p-3 mb-3">
            <div class="row align-items-center">
                <div class="col-md-2">
                    <img src="{{ url_for('static', filename='images/' + item.product.image) }}"
                         class="img-fluid">
                </div>
                <div class="col-md-6">
                    <h5>{{ item.product.name }}</h5>
                    <p>Qty: {{ item.quantity }}</p>
                </div>
                <div class="col-md-2">
                    ₹{{ item.product.price }}
                </div>
                <div class="col-md-2">
                    <a href="/remove-from-cart/{{ item.product.id }}"
                       class="btn btn-danger btn-sm">Remove</a>
                </div>
            </div>
        </div>
        {% endfor %}

        <div class="text-end">
            <a href="/checkout-cart" class="btn btn-success">
                Proceed to Checkout
            </a>
        </div>

    {% else %}
        <p>Your cart is empty.</p>
    {% endif %}
</div>

{% endblock %}
