{% extends "base.html" %}
{% block content %}

<div class="container mt-5 text-center">

    <h2 class="mb-4">Payment</h2>

    <div class="card p-4 shadow" style="max-width: 500px; margin: auto;">

        <h4>{{ product.name }}</h4>
        <h3 class="text-success">₹{{ product.price }}</h3>

        <form method="POST" action="/confirm-order/{{ product.id }}">
            
            <div class="text-start mt-4">
                <label class="form-label">Payment Method</label>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="payment" value="UPI" checked>
                    <label class="form-check-label">UPI</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="payment" value="Cash on Delivery">
                    <label class="form-check-label">Cash on Delivery</label>
                </div>
            </div>

            <button class="btn btn-success w-100 mt-4">
                Confirm Order
            </button>
        </form>

    </div>

</div>

{% endblock %}
