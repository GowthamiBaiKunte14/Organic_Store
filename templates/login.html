{% extends "base.html" %}
{% block content %}

<div class="auth-wrapper">

    <!-- LOGIN CARD -->
    <div class="auth-card">
        <h3 class="auth-title">Welcome Back</h3>
        <p class="auth-subtitle">Login to your account</p>

        <form action="/login" method="POST">
            <input name="email" class="form-control" placeholder="Email" required>
            <input type="password" name="password" class="form-control" placeholder="Password" required>

            {% if error %}
                <p style="color:red; margin-top:8px;">{{ error }}</p>
            {% endif %}

            <button class="btn btn-success w-100 mt-3">Login</button>
        </form>
    </div>

    <!-- REGISTER CARD -->
    <div class="auth-card light">
        <h4 class="auth-title">New here?</h4>
        <p class="auth-subtitle">Create your account</p>

        <form action="/register" method="POST">
            <input name="name" class="form-control" placeholder="Name" required>
            <input name="email" class="form-control" placeholder="Email" required>
            <input type="password" name="password" class="form-control" placeholder="Password" required>
            <input type="password" name="confirm_password" class="form-control" placeholder="Confirm Password" required>

            <button class="btn btn-primary w-100 mt-3">Register</button>
        </form>
    </div>

</div>

{% endblock %}
