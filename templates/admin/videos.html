{% extends "admin/base.html" %}
{% block content %}

<h2>Videos Manager</h2>

<h4>Add New Video</h4>
<form method="POST" action="/admin/videos/add">
    <input type="text" name="title" placeholder="Video Title" required>
    <input type="text" name="url" placeholder="Video URL" required>
    <button type="submit">Add Video</button>
</form>

<hr>

<table border="1" cellpadding="10">
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>URL</th>
        <th>Action</th>
    </tr>

    {% for video in videos %}
    <tr>
        <td>{{ video.id }}</td>
        <td>{{ video.title }}</td>
        <td>{{ video.url }}</td>
        <td>
            <a href="/admin/videos/delete/{{ video.id }}">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
