<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pristine Organic Oils</title>
<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<meta name="description"
content="Pristine Organic Foods and Oils – Buy cold pressed oils, organic seeds, traditional pickles online. Pure, natural and chemical free products.">

<meta name="keywords"
content="organic oils, cold pressed oils, organic seeds, natural foods, traditional pickles">

<meta name="author" content="Pristine Organic Foods and Oils">

</head>

<body>
<div id="pageLoader">
  <div class="loader-circle"></div>
</div>

<nav class="main-navbar">

  <div class="nav-container">

    <!-- LEFT BRAND -->

    <div class="nav-left">

      <img src="{{ url_for('static', filename='images/logo.png') }}" class="nav-logo">

      <span class="brand-name">
        Pristine Organic Foods and Oils
      </span>

    </div>


    <!-- HAMBURGER -->

    <div class="hamburger" id="hamburger">
      ☰
    </div>


    <!-- MENU -->

    <ul class="nav-menu" id="navMenu">

      <li>
        <a href="/" class="{% if request.path == '/' %}active{% endif %}">
          Home
        </a>
      </li>

      <li>
        <a href="/products" class="{% if request.path == '/products' %}active{% endif %}">
          Products
        </a>
      </li>

      <li>
        <a href="/orders" class="{% if request.path == '/orders' %}active{% endif %}">
          Orders
        </a>
      </li>

      <li>
        <a href="/contact" class="{% if request.path == '/contact' %}active{% endif %}">
          Contact
        </a>
      </li>

      <li>
        <a href="/track-order" class="{% if request.path == '/track-order' %}active{% endif %}">
          Track Order
        </a>
      </li>


    </ul>


    <!-- RIGHT ICONS -->

    <div class="nav-icons">

      <a href="/cart" class="cart-icon">
          🛒 <span id="cartCount">{{ cart_count }}</span>
      </a>

      <a href="/login">👤</a>

    </div>

  </div>

</nav>

{% block content %}{% endblock %}

<!-- QUICK VIEW MODAL -->

<div id="quickModal" class="quick-modal">

  <div class="quick-box">

    <span id="closeQuick">×</span>

    <img id="quickImg">

    <h4 id="quickName"></h4>

    <p id="quickPrice"></p>

  </div>

</div>

<button id="backTop">↑</button>

<script>
function addToCart(id) {
    fetch("/add-to-cart/" + id)
        .then(res => res.json())
        .then(data => {
            updateCartCount();
        });
}

function updateCartCount() {
    fetch("/cart-count")
        .then(res => res.json())
        .then(data => {
            document.getElementById("cartCount").innerText = data.count;
        });
}

/* Load cart count when page opens */
document.addEventListener("DOMContentLoaded", function() {
    updateCartCount();
});
</script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script async src="https://www.instagram.com/embed.js"></script>

<a href="https://wa.me/919876543210"
   class="whatsapp-btn"
   target="_blank">
   💬
</a>

</body>
</html>
